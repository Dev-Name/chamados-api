# PostgreSQL
services:
  db:
    image: postgres:16
    container_name: chamados-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chamados
    ports:
      - "5432:5432"
    volumes:
      - chamados_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chamados"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chamados_pgdata: