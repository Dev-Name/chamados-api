<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0;url=http://localhost:3000">
  <title>Chamados — redirecionando</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f3f4f6; color: #111827;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 32px 40px; max-width: 420px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #4b5563; font-size: 14px; line-height: 1.5; margin: 0 0 16px; }
    a.btn { display: inline-block; background: #2563eb; color: #fff; text-decoration: none; padding: 10px 18px;
            border-radius: 8px; font-weight: 600; }
    .hint { font-size: 12px; color: #9ca3af; margin-top: 14px; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Abrindo o sistema de chamados…</h1>
    <p id="msg">Se nada acontecer em alguns segundos, clique no botão abaixo.</p>
    <a class="btn" href="http://localhost:3000">Abrir sistema de chamados</a>
    <div class="hint">O app roda no servidor Node na porta 3000. Se aparecer <i>“site não consegue ser alcançado”</i>,
      inicie o backend com <code>npm start</code> na pasta do projeto.</div>
  </div>
  <script>setTimeout(function () { window.location.replace("http://localhost:3000"); }, 500);</script>
</body>
</html>
